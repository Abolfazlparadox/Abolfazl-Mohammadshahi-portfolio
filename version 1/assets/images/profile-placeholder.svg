<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)" rx="24" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Tech Hexagon Frame -->
  <polygon points="200,60 310,125 310,255 200,320 90,255 90,125" fill="rgba(0, 102, 255, 0.06)" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)" />

  <!-- Technical Code Avatar Silhouette -->
  <circle cx="200" cy="150" r="45" fill="none" stroke="url(#accent-grad)" stroke-width="3" />
  <path d="M125,270 C125,215 155,210 200,210 C245,210 275,215 275,270" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Code Monogram -->
  <text x="200" y="160" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">&lt;AM/&gt;</text>
  
  <!-- Subtle Glowing Corners -->
  <circle cx="90" cy="125" r="4" fill="#0066ff" />
  <circle cx="310" cy="125" r="4" fill="#0066ff" />
  <circle cx="310" cy="255" r="4" fill="#0066ff" />
  <circle cx="90" cy="255" r="4" fill="#0066ff" />
  <circle cx="200" cy="60" r="4" fill="#60a5fa" />
  <circle cx="200" cy="320" r="4" fill="#60a5fa" />
</svg>
